<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review - WDD 131</title>
    <meta name="description" content="Product Review Form for WDD 131 assignment. Features dynamic product selection and star rating.">
    <meta name="author" content="Adriana Sandoval">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="form.css">
    <script src="form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Product Information</legend>
                
                <label for="product-name">Product Name</label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Options populated by JavaScript -->
                </select>

                <div class="rating-group">
                    <label>Overall Rating</label>
                    <div class="stars">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars"></label>
                        <input type="radio" id="star4" name="rating" value="4">
                        <label for="star4" title="4 stars"></label>
                        <input type="radio" id="star3" name="rating" value="3">
                        <label for="star3" title="3 stars"></label>
                        <input type="radio" id="star2" name="rating" value="2">
                        <label for="star2" title="2 stars"></label>
                        <input type="radio" id="star1" name="rating" value="1">
                        <label for="star1" title="1 star"></label>
                    </div>
                </div>

                <label for="install-date">Date of Installation</label>
                <input type="date" id="install-date" name="install-date" required>

                <div class="features-group">
                    <label>Useful Features (check all that apply)</label>
                    <div class="checkbox-container">
                        <label><input type="checkbox" name="features" value="durability"> Durability</label>
                        <label><input type="checkbox" name="features" value="design"> Design</label>
                        <label><input type="checkbox" name="features" value="performance"> Performance</label>
                        <label><input type="checkbox" name="features" value="price"> Price</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Your Review</legend>
                
                <label for="written-review">Written Review (Optional)</label>
                <textarea id="written-review" name="written-review" rows="5"></textarea>

                <label for="user-name">Your Name (Optional)</label>
                <input type="text" id="user-name" name="user-name">
            </fieldset>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Adriana Sandoval | last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
